name: Aqua Eterna CI
on:
  pull_request:
  push:
    branches: [master, 'feature/mvp-0.32-react-docker', 'feature/mvp-0.33-parallax']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - run: docker compose up -d --build
      - name: Validate runtime
        run: |
          curl --fail --retry 12 --retry-connrefused --retry-delay 2 http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/ | grep -q 'id="root"'
      - if: always()
        run: docker compose down
